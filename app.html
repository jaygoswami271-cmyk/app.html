<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Goswami Fast Food - Manager</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Goswami App">
  <style>
    :root {
      --primary: #d9381e;
      --bg: #f4f5f8;
      --card: #ffffff;
      --text: #222222;
      --muted: #666666;
      --green: #2e7d32;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 80px; }
    
    header { background: var(--primary); color: white; padding: 18px 16px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
    header h1 { font-size: 19px; font-weight: 700; }
    header p { font-size: 12px; opacity: 0.9; margin-top: 2px; }

    .tab-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid #ddd; display: flex; justify-content: space-around; padding: 8px 0; z-index: 100; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
    .tab-btn { background: none; border: none; font-size: 11px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 600; width: 25%; }
    .tab-btn.active { color: var(--primary); }
    .tab-btn span { font-size: 18px; }

    .container { padding: 14px; }
    .view-section { display: none; }
    .view-section.active { display: block; }

    .card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .card-title { font-size: 15px; font-weight: 700; margin-bottom: 10px; color: #111; display: flex; justify-content: space-between; align-items: center; }

    input, select, textarea { width: 100%; padding: 10px 12px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; background: #fafafa; }
    button.btn-primary { width: 100%; background: var(--primary); color: white; border: none; padding: 11px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button.btn-delete { background: #fee2e2; color: #b91c1c; border: none; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }

    .item-row { border-bottom: 1px solid #eee; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
    .item-row:last-child { border-bottom: none; }
    .badge { padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; background: #e0f2fe; color: #0369a1; }
    .balance-tag { color: #dc2626; font-weight: bold; font-size: 13px; }
    .paid-tag { color: var(--green); font-weight: bold; font-size: 13px; }
  </style>
</head>
<body>

  <header>
    <h1>Goswami Fast Food & Catering</h1>
    <p>Manager Dashboard</p>
  </header>

  <div class="container">
    <!-- 1. BOOKINGS -->
    <section id="bookings" class="view-section active">
      <div class="card">
        <div class="card-title">Nayi Booking Add Karein</div>
        <input type="text" id="bName" placeholder="Grahak ka Naam">
        <input type="tel" id="bPhone" placeholder="Mobile Number">
        <input type="date" id="bDate">
        <input type="number" id="bGuests" placeholder="Mehman sankhya (Guests)">
        <input type="number" id="bTotal" placeholder="Total Bill (₹)">
        <input type="number" id="bAdvance" placeholder="Advance Mila (₹)">
        <button class="btn-primary" onclick="addBooking()">Booking Save Karein</button>
      </div>

      <div class="card">
        <div class="card-title">Aane Wali Bookings</div>
        <div id="bookingList">Koi booking nahi hai.</div>
      </div>
    </section>

    <!-- 2. KARIGAR HISAB -->
    <section id="karigar" class="view-section">
      <div class="card">
        <div class="card-title">Karigar Entry</div>
        <input type="text" id="kName" placeholder="Karigar / Helper ka Naam">
        <input type="text" id="kEvent" placeholder="Event / Kaam ki jagah">
        <input type="number" id="kPay" placeholder="Tay Mehnatana / Rate (₹)">
        <input type="number" id="kAdvance" placeholder="Diya gaya Advance (₹)">
        <button class="btn-primary" onclick="addKarigar()">Hisaab Save Karein</button>
      </div>

      <div class="card">
        <div class="card-title">Karigar Baaki Hisaab</div>
        <div id="karigarList">Koi data nahi hai.</div>
      </div>
    </section>

    <!-- 3. MENU -->
    <section id="menu" class="view-section">
      <div class="card">
        <div class="card-title">Nayi Dish Add Karein</div>
        <input type="text" id="mItem" placeholder="Dish / Item ka Naam">
        <input type="text" id="mRate" placeholder="Rate (e.g. ₹50/Plate ya ₹200)">
        <button class="btn-primary" onclick="addMenuItem()">Menu me Jodein</button>
      </div>

      <div class="card">
        <div class="card-title">Menu List</div>
        <div id="menuList">List khali hai.</div>
      </div>
    </section>

    <!-- 4. KHARCHA / HISAB -->
    <section id="expenses" class="view-section">
      <div class="card">
        <div class="card-title">Daily Kharcha Note Karein</div>
        <input type="text" id="eDesc" placeholder="Kaha kharcha hua (Sabji, Gas, Doodh...)">
        <input type="number" id="eAmount" placeholder="Kharcha Rashi (₹)">
        <button class="btn-primary" onclick="addExpense()">Kharcha Jodein</button>
      </div>

      <div class="card">
        <div class="card-title">Kharcha Diary</div>
        <div id="expenseList">Koi kharcha darz nahi.</div>
      </div>
    </section>
  </div>

  <nav class="tab-nav">
    <button class="tab-btn active" onclick="showTab('bookings')"><span>📋</span>Bookings</button>
    <button class="tab-btn" onclick="showTab('karigar')"><span>👨‍🍳</span>Karigar</button>
    <button class="tab-btn" onclick="showTab('menu')"><span>🍲</span>Menu</button>
    <button class="tab-btn" onclick="showTab('expenses')"><span>💰</span>Kharcha</button>
  </nav>

  <script>
    function showTab(tabId) {
      document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    let bookings = JSON.parse(localStorage.getItem('g_bookings') || '[]');
    let karigars = JSON.parse(localStorage.getItem('g_karigars') || '[]');
    let menuItems = JSON.parse(localStorage.getItem('g_menu') || '[]');
    let expenses = JSON.parse(localStorage.getItem('g_expenses') || '[]');

    function renderAll() {
      // Bookings Render
      const bList = document.getElementById('bookingList');
      bList.innerHTML = bookings.length === 0 ? '<p style="color:#888;">Koi booking nahi hai.</p>' : bookings.map((b, i) => `
        <div class="item-row">
          <div>
            <strong>${b.name}</strong> (${b.guests} log)<br>
            <small style="color:#555;">📅 ${b.date} | 📞 ${b.phone}</small><br>
            <small>Total: ₹${b.total} | Adv: ₹${b.advance}</small><br>
            <span class="${(b.total - b.advance) > 0 ? 'balance-tag' : 'paid-tag'}">
              Baaki: ₹${b.total - b.advance}
            </span>
          </div>
          <button class="btn-delete" onclick="deleteItem('booking', ${i})">Hatao</button>
        </div>
      `).join('');

      // Karigar Render
      const kList = document.getElementById('karigarList');
      kList.innerHTML = karigars.length === 0 ? '<p style="color:#888;">Koi hisaab nahi hai.</p>' : karigars.map((k, i) => `
        <div class="item-row">
          <div>
            <strong>${k.name}</strong> - <span class="badge">${k.event}</span><br>
            <small>Mehnatana: ₹${k.pay} | Diya: ₹${k.advance}</small><br>
            <span class="${(k.pay - k.advance) > 0 ? 'balance-tag' : 'paid-tag'}">
              Dena baaki: ₹${k.pay - k.advance}
            </span>
          </div>
          <button class="btn-delete" onclick="deleteItem('karigar', ${i})">Hatao</button>
        </div>
      `).join('');

      // Menu Render
      const mList = document.getElementById('menuList');
      mList.innerHTML = menuItems.length === 0 ? '<p style="color:#888;">Menu khali hai.</p>' : menuItems.map((m, i) => `
        <div class="item-row">
          <div><strong>${m.item}</strong></div>
          <div><span style="font-weight:bold; margin-right:8px;">${m.rate}</span><button class="btn-delete" onclick="deleteItem('menu', ${i})">Hatao</button></div>
        </div>
      `).join('');

      // Expenses Render
      const eList = document.getElementById('expenseList');
      let totalEx = expenses.reduce((s, e) => s + Number(e.amount), 0);
      eList.innerHTML = expenses.length === 0 ? '<p style="color:#888;">Koi kharcha nahi.</p>' : `
        <div style="margin-bottom:8px; font-weight:bold; color:#d9381e;">Total Kharcha: ₹${totalEx}</div>
        ` + expenses.map((e, i) => `
        <div class="item-row">
          <div>${e.desc}</div>
          <div><strong style="margin-right:8px;">₹${e.amount}</strong><button class="btn-delete" onclick="deleteItem('expense', ${i})">Hatao</button></div>
        </div>
      `).join('');
    }

    function addBooking() {
      const name = document.getElementById('bName').value;
      if(!name) return alert('Naam bhariye');
      bookings.push({
        name,
        phone: document.getElementById('bPhone').value,
        date: document.getElementById('bDate').value,
        guests: document.getElementById('bGuests').value,
        total: Number(document.getElementById('bTotal').value || 0),
        advance: Number(document.getElementById('bAdvance').value || 0)
      });
      localStorage.setItem('g_bookings', JSON.stringify(bookings));
      document.getElementById('bName').value = '';
      document.getElementById('bPhone').value = '';
      document.getElementById('bDate').value = '';
      document.getElementById('bGuests').value = '';
      document.getElementById('bTotal').value = '';
      document.getElementById('bAdvance').value = '';
      renderAll();
    }

    function addKarigar() {
      const name = document.getElementById('k
